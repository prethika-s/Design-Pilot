version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: architectai_db
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: architectai_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/architectai
      - JWT_SECRET=supersecretjwtsecretkeywhichislongandsecure
      - NODE_ENV=production
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: architectai_frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
